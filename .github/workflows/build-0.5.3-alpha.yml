name: Build Ember CoreUI 0.5.3-alpha release

on:
  push:
    branches:
      - release/0.5.3-alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate release
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/":!.github\/\*\*",/":!.github\/\*\*", ":!README.md",/' .github/release_053.py
          python3 .github/release_053.py

      - name: Commit release and remove temporary builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/release_053.py .github/workflows/build-0.5.3-alpha.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare Ember CoreUI 0.5.3-alpha"
          git push origin HEAD:release/0.5.3-alpha
