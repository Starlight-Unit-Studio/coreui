name: Apply Gemma 4 fast-path patch

on:
  push:
    branches:
      - fix/gemma4-minimal-ollama-options
    paths:
      - .github/workflows/apply-gemma4-fastpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemma4-minimal-ollama-options
          fetch-depth: 0

      - name: Apply minimal known-good Gemma 4 options
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          chat = 'api/chat.php'
          helper_anchor = """function ember_repeat_last_n(): int {
            $n = (int)ember_cfg('STU_EMBER_REPEAT_LAST_N', 96);
            return max(0, min(512, $n));
          }
          """
          helper_new = helper_anchor + """
          // Gemma 4 / Ollama minimal known-good fast path (Turin validation, 2026-09-04).
          // Only the three validated sampling keys are forwarded inside Ollama `options`.
          // Context, predict, thread, repeat, seed and stop controls stay backend-managed
          // unless a future isolated A/B benchmark explicitly validates them.
          function ember_ollama_known_good_options(array $optionOverrides = []): array {
            $options = [
              'temperature' => ember_temperature(),
              'top_p' => defined('STU_EMBER_TOP_P') ? ember_top_p() : 0.95,
              'top_k' => defined('STU_EMBER_TOP_K') ? ember_top_k() : 64,
            ];
            $allowed = [
              'temperature' => true,
              'top_p' => true,
              'top_k' => true,
            ];
            foreach ($optionOverrides as $k => $v) {
              if ($v === null || !isset($allowed[$k])) continue;
              $options[$k] = $v;
            }
            return $options;
          }
          """
          replace_once(chat, helper_anchor, helper_new)

          old_sync = """  $options = [
              'num_thread' => ember_num_thread(),
              'temperature' => ember_temperature(),
              'top_p' => ember_top_p(),
              'repeat_penalty' => ember_repeat_penalty(),
              'num_predict' => ember_num_predict_for_model($model),
              'num_ctx' => ember_num_ctx_for_model($model),
              'stop' => ember_stop_tokens_for_model($model),
              'seed' => ember_seed_for_model($model),
              'top_k' => ember_top_k(),
              'repeat_last_n' => ember_repeat_last_n(),
            ];
            // Gemma 4 Thinking-Parameter (nur wenn nicht explizit konfiguriert).
            if (!defined('STU_EMBER_TEMPERATURE'))    $options['temperature']    = 0.80;
            if (!defined('STU_EMBER_TOP_P'))          $options['top_p']          = 0.95;
            if (!defined('STU_EMBER_TOP_K'))          $options['top_k']          = 64;
            if (!defined('STU_EMBER_REPEAT_PENALTY')) $options['repeat_penalty'] = 1.08;
            if (!defined('STU_EMBER_REPEAT_LAST_N'))  $options['repeat_last_n'] = 64;
            if (!defined('STU_EMBER_NUM_THREAD'))     $options['num_thread']     = 12;
            if (!empty($optionOverrides)) {
              foreach ($optionOverrides as $k => $v) {
                if ($v === null) continue;
                $options[$k] = $v;
              }
            }
          """
          new_sync = """  // Keep the Gemma 4 fast path intentionally minimal. Renderer/parser remain
            // Modelfile concerns; PHP forwards only the validated sampling keys.
            $options = ember_ollama_known_good_options($optionOverrides);
          """
          replace_once(chat, old_sync, new_sync)

          stream = 'api/console_stream.php'
          old_stream = """  $options = [
              'num_thread'     => ember_num_thread(),
              'temperature'    => ember_temperature(),
              'top_p'          => ember_top_p(),
              'repeat_penalty' => ember_repeat_penalty(),
              'num_predict'    => ember_num_predict_for_model($model),
              'num_ctx'        => ember_num_ctx_for_model($model),
              'stop'           => ember_stop_tokens_for_model($model),
              'seed'           => ember_seed_for_model($model),
              'top_k'          => ember_top_k(),
              'repeat_last_n'  => ember_repeat_last_n(),
            ];
            if (!defined('STU_EMBER_TEMPERATURE'))    $options['temperature']    = 0.80;
            if (!defined('STU_EMBER_TOP_P'))          $options['top_p']          = 0.95;
            if (!defined('STU_EMBER_TOP_K'))          $options['top_k']          = 64;
            if (!defined('STU_EMBER_REPEAT_PENALTY')) $options['repeat_penalty'] = 1.08;
            if (!defined('STU_EMBER_REPEAT_LAST_N'))  $options['repeat_last_n']  = 64;
            if (!defined('STU_EMBER_NUM_THREAD'))     $options['num_thread']     = 12;
          """
          new_stream = """  // Match the synchronous Gemma 4 fast path exactly.
            $options = ember_ollama_known_good_options();
          """
          replace_once(stream, old_stream, new_stream)

          cfg = Path('api/config.local.php.example')
          cfg_text = cfg.read_text(encoding='utf-8')
          old_cfg = """define('STU_EMBER_LOCK_NAMESPACE', 'ember_coreui');
          define('STU_EMBER_NUM_PREDICT', 6500);
          define('STU_EMBER_TIMEOUT', 600);
          """
          new_cfg = """define('STU_EMBER_LOCK_NAMESPACE', 'ember_coreui');
          // Gemma 4 fast path: PHP forwards only temperature/top_p/top_k to Ollama.
          // This legacy value is retained only as an application-side output budget;
          // it is intentionally NOT sent as Ollama num_predict.
          define('STU_EMBER_NUM_PREDICT', 6500);
          define('STU_EMBER_TIMEOUT', 600);
          """
          if cfg_text.count(old_cfg) != 1:
              raise SystemExit('api/config.local.php.example: expected config anchor once')
          cfg.write_text(cfg_text.replace(old_cfg, new_cfg, 1), encoding='utf-8')
          PY

      - name: PHP lint
        shell: bash
        run: |
          php -l api/chat.php
          php -l api/console_stream.php
          php -l api/config.local.php.example

      - name: Audit remaining backend option candidates
        shell: bash
        run: |
          echo 'Remaining candidate option lines (review only):'
          grep -nE "['\"](num_ctx|num_predict|num_thread|repeat_penalty|repeat_last_n|seed|stop)['\"][[:space:]]*=>" api/chat.php api/console_stream.php || true

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chat.php api/console_stream.php api/config.local.php.example
          git commit -m 'Optimize Gemma 4 Ollama fast path'
          git push origin HEAD:fix/gemma4-minimal-ollama-options
