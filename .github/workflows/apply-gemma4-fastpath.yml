name: Apply Gemma 4 fast-path patch

on:
  push:
    branches:
      - fix/gemma4-minimal-ollama-options
    paths:
      - .github/workflows/apply-gemma4-fastpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemma4-minimal-ollama-options
          fetch-depth: 0

      - name: Remove legacy per-call Gemma 4 knobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def apply(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for label, old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path} [{label}]: expected {expected}, got {count}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          apply('api/chat.php', [
              ('last-call num_predict metadata', "    'num_predict' => (int)($options['num_predict'] ?? 0),\n", '', 2),
              ('truncation limit read', "  $limit = (int)($meta['num_predict'] ?? 0);\n  $used = (int)($meta['eval_count'] ?? 0);\n  return $limit > 0 && $used >= $limit;\n", "  return false;\n", 1),
              ('continuation debug metadata', "      'num_predict' => (int)($previousMeta['num_predict'] ?? 0),\n", '', 1),
              ('continuation override', "      ['num_predict' => ember_num_predict_for_model($model)],\n", "      [],\n", 1),
              ('vision overrides', "      ['num_predict' => 6500, 'num_ctx' => ember_num_ctx_for_model($primaryModel)],\n", "      [],\n", 1),
              ('warmup num_predict', "        'num_predict' => 8,\n", '', 1),
              ('warmup num_ctx', "        'num_ctx' => 512,\n", '', 1),
              ('warmup temperature', "        'temperature' => 0.1,\n", '', 1),
              ('warmup top_p', "        'top_p' => 0.5,\n", '', 1),
          ])

          apply('api/console_stream.php', [
              ('stream num_predict read', "  $numPredict = (int)($options['num_predict'] ?? 0);\n", '', 1),
              ('stream limit clause', "    || ($numPredict > 0 && $evalCount >= $numPredict)\n", '', 1),
              ('stream debug num_predict', "      'num_predict' => $numPredict,\n", '', 1),
          ])
          PY

      - name: PHP lint
        shell: bash
        run: |
          php -l api/chat.php
          php -l api/console_stream.php
          php -l api/config.local.php.example

      - name: Audit remaining backend option candidates
        shell: bash
        run: |
          echo 'Remaining candidate option lines (review only):'
          grep -nE "['\"](num_ctx|num_predict|num_thread|repeat_penalty|repeat_last_n|seed|stop)['\"][[:space:]]*=>" api/chat.php api/console_stream.php || true
          echo 'Known-good helper call sites:'
          grep -n "ember_ollama_known_good_options" api/chat.php api/console_stream.php

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chat.php api/console_stream.php
          git commit -m 'Remove legacy Gemma 4 per-call overrides'
          git push origin HEAD:fix/gemma4-minimal-ollama-options
