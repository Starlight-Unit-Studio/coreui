name: Apply Gemma 4 fast-path patch

on:
  push:
    branches:
      - fix/gemma4-minimal-ollama-options
    paths:
      - .github/workflows/apply-gemma4-fastpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemma4-minimal-ollama-options
          fetch-depth: 0

      - name: Remove legacy per-call Gemma 4 knobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          chat = 'api/chat.php'

          replace_once(chat,
          """    'prompt_eval_count' => 0,
              'num_predict' => (int)($options['num_predict'] ?? 0),
          """,
          """    'prompt_eval_count' => 0,
          """)
          replace_once(chat,
          """    'prompt_eval_count' => 0,
              'num_predict' => (int)($options['num_predict'] ?? 0),
          """,
          """    'prompt_eval_count' => 0,
          """)

          replace_once(chat,
          """  $limit = (int)($meta['num_predict'] ?? 0);
            $used = (int)($meta['eval_count'] ?? 0);
            return $limit > 0 && $used >= $limit;
          """,
          """  return false;
          """)

          replace_once(chat,
          """      'eval_count' => (int)($previousMeta['eval_count'] ?? 0),
              'num_predict' => (int)($previousMeta['num_predict'] ?? 0),
          """,
          """      'eval_count' => (int)($previousMeta['eval_count'] ?? 0),
          """)

          replace_once(chat,
          """      ember_timeout_for_model($model),
              ['num_predict' => ember_num_predict_for_model($model)],
              $imageUrl
          """,
          """      ember_timeout_for_model($model),
              [],
              $imageUrl
          """)

          replace_once(chat,
          """      $visionTimeout,
              ['num_predict' => 6500, 'num_ctx' => ember_num_ctx_for_model($primaryModel)],
              $imageUrl
          """,
          """      $visionTimeout,
              [],
              $imageUrl
          """)

          replace_once(chat,
          """      ember_call_ollama(ember_model(), \"DU BIST EMBER. Antworte exakt mit ok.\", \"ok\", 8, [
                '__suppress_fail_log' => 1,
                'num_predict' => 8,
                'num_ctx' => 512,
                'temperature' => 0.1,
                'top_p' => 0.5,
              ]);
          """,
          """      ember_call_ollama(ember_model(), \"DU BIST EMBER. Antworte exakt mit ok.\", \"ok\", 8, [
                '__suppress_fail_log' => 1,
              ]);
          """)

          stream = 'api/console_stream.php'
          replace_once(stream,
          """  $numPredict = (int)($options['num_predict'] ?? 0);
            $reasonLower = strtolower($doneReason);
            $truncated = in_array($reasonLower, ['length', 'max_tokens', 'token_limit'], true)
              || ($numPredict > 0 && $evalCount >= $numPredict)
              || ($doneSeen && !$done);
          """,
          """  $reasonLower = strtolower($doneReason);
            $truncated = in_array($reasonLower, ['length', 'max_tokens', 'token_limit'], true)
              || ($doneSeen && !$done);
          """)

          replace_once(stream,
          """      'eval_count' => $evalCount,
              'num_predict' => $numPredict,
          """,
          """      'eval_count' => $evalCount,
          """)
          PY

      - name: PHP lint
        shell: bash
        run: |
          php -l api/chat.php
          php -l api/console_stream.php
          php -l api/config.local.php.example

      - name: Audit remaining backend option candidates
        shell: bash
        run: |
          echo 'Remaining candidate option lines (review only):'
          grep -nE "['\"](num_ctx|num_predict|num_thread|repeat_penalty|repeat_last_n|seed|stop)['\"][[:space:]]*=>" api/chat.php api/console_stream.php || true
          echo 'Known-good helper call sites:'
          grep -n "ember_ollama_known_good_options" api/chat.php api/console_stream.php

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chat.php api/console_stream.php
          git commit -m 'Remove legacy Gemma 4 per-call overrides'
          git push origin HEAD:fix/gemma4-minimal-ollama-options
